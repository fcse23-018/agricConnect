name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

# Cancel superseded runs on the same ref.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  backend:
    name: Backend (Node.js)
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: agriconnect
          POSTGRES_PASSWORD: agriconnect
          POSTGRES_DB: agriconnect_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U agriconnect"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 20

    env:
      NODE_ENV: test
      PGHOST: localhost
      PGPORT: 5432
      PGDATABASE: agriconnect_test
      PGUSER: agriconnect
      PGPASSWORD: agriconnect
      JWT_ACCESS_SECRET: ci-access-secret-not-for-production
      JWT_REFRESH_SECRET: ci-refresh-secret-not-for-production
      EXPOSE_DEV_CODES: "true"
      GEE_ENABLED: "false"

    defaults:
      run:
        working-directory: backend

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '20'

      # No package-lock.json is committed yet, so `npm install` (not `npm ci`).
      - name: Install dependencies
        run: npm install --no-audit --no-fund

      - name: Apply database migrations
        run: npm run migrate

      - name: Run tests
        run: npm test

  android:
    name: Android (assemble + unit tests)
    runs-on: ubuntu-latest

    defaults:
      run:
        working-directory: android

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      # v3 downloads a command-line-tools package that Google has since retired, so it
      # fails before any build step runs (upstream fix: v4.0.2, "Fix for removed tools
      # package"). v4 also moves the action off the deprecated Node 20 runtime.
      - uses: android-actions/setup-android@v4

      # Pin the exact SDK components the build compiles against (compileSdk 35).
      - name: Install Android SDK components
        run: sdkmanager "platforms;android-35" "build-tools;35.0.0"

      # The Gradle wrapper is committed (Gradle 8.9, required by AGP 8.7), so the
      # build runs through ./gradlew. setup-gradle only adds dependency/build caching.
      - uses: gradle/actions/setup-gradle@v4

      - name: Make wrapper executable
        run: chmod +x gradlew

      - name: Assemble debug APK
        run: ./gradlew :app:assembleDebug --stacktrace

      # Hand out an APK that cannot be mistaken for an older download: the file name
      # carries the version and the commit. Packaging sits before the tests so a green
      # build always publishes an installable artifact, even if a test later fails.
      - name: Name the APK after its version and commit
        run: |
          version=$(jq -r '.elements[0].versionName' app/build/outputs/apk/debug/output-metadata.json)
          sha=$(echo "${GITHUB_SHA}" | cut -c1-7)
          name="agriconnect-debug-v${version}-${sha}.apk"
          cp app/build/outputs/apk/debug/app-debug.apk "$name"
          echo "APK_NAME=${name}" >> "$GITHUB_ENV"
          echo "APK_PATH=android/${name}" >> "$GITHUB_ENV"

      - uses: actions/upload-artifact@v4
        with:
          name: ${{ env.APK_NAME }}
          path: ${{ env.APK_PATH }}
          if-no-files-found: error
          retention-days: 14

      - name: Run unit tests
        run: ./gradlew :app:testDebugUnitTest --stacktrace
