name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

# Cancel superseded runs on the same ref.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  backend:
    name: Backend (Node.js)
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: agriconnect
          POSTGRES_PASSWORD: agriconnect
          POSTGRES_DB: agriconnect_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U agriconnect"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 20

    env:
      NODE_ENV: test
      PGHOST: localhost
      PGPORT: 5432
      PGDATABASE: agriconnect_test
      PGUSER: agriconnect
      PGPASSWORD: agriconnect
      JWT_ACCESS_SECRET: ci-access-secret-not-for-production
      JWT_REFRESH_SECRET: ci-refresh-secret-not-for-production
      EXPOSE_DEV_CODES: "true"
      GEE_ENABLED: "false"

    defaults:
      run:
        working-directory: backend

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '20'

      # No package-lock.json is committed yet, so `npm install` (not `npm ci`).
      - name: Install dependencies
        run: npm install --no-audit --no-fund

      - name: Apply database migrations
        run: npm run migrate

      - name: Run tests
        run: npm test

  android:
    name: Android (assemble + unit tests)
    runs-on: ubuntu-latest

    defaults:
      run:
        working-directory: android

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - uses: android-actions/setup-android@v3

      # No Gradle wrapper is committed, so setup-gradle provides the `gradle`
      # executable directly (AGP 8.7 requires Gradle 8.9+).
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Assemble debug APK
        run: gradle :app:assembleDebug --stacktrace

      - name: Run unit tests
        run: gradle :app:testDebugUnitTest --stacktrace
