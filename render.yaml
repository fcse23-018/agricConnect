
# Render Blueprint — AgriConnect API
# Deploy through Render Dashboard → New → Blueprint.

services:
  - type: web
    name: agriconnect-api
    runtime: node
    plan: free
    rootDir: backend

    # Install dependencies during the build.
    buildCommand: npm ci

    # Free-tier compatible: run idempotent migrations at startup.
    # If migrations fail, the API will not start.
    startCommand: npm run migrate && npm start

    healthCheckPath: /health

    envVars:
      # Runtime
      - key: NODE_ENV
        value: production

      - key: PORT
        value: "10000"

      - key: PUBLIC_BASE_URL
        sync: false

      # Native Android client
      - key: CORS_ORIGINS
        value: ""

      # Supabase PostgreSQL
      - key: DATABASE_URL
        sync: false

      - key: PGSSLMODE
        value: require

      # Authentication secrets generated by Render
      - key: JWT_ACCESS_SECRET
        generateValue: true

      - key: JWT_REFRESH_SECRET
        generateValue: true

      # Delivery configuration
      - key: DELIVERY_PROVIDER
        value: NONE

      - key: ALLOW_DELIVERY_GAP
        value: "true"

      # Supabase Storage
      - key: UPLOAD_DRIVER
        value: supabase

      - key: SUPABASE_URL
        sync: false

      - key: SUPABASE_SERVICE_ROLE_KEY
        sync: false

      - key: SUPABASE_STORAGE_BUCKET
        value: agriconnect-uploads

      # Satellite monitoring
      - key: GEE_ENABLED
        value: "false"
