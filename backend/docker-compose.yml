# AgriConnect — local / single-host deployment.
#
#   docker compose up -d --build
#
# The API waits for PostgreSQL to become healthy, then runs migrations as a
# one-shot service so application containers never race the schema.
services:
  db:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: agriconnect
      POSTGRES_PASSWORD: agriconnect_dev_password
      POSTGRES_DB: agriconnect
    ports:
      - "5433:5432"
    volumes:
      - agri_pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U agriconnect -d agriconnect"]
      interval: 5s
      timeout: 5s
      retries: 20

  migrate:
    build: .
    depends_on:
      db:
        condition: service_healthy
    environment:
      NODE_ENV: production
      DATABASE_URL: postgres://agriconnect:agriconnect_dev_password@db:5432/agriconnect
    command: ["node", "src/db/migrate.js"]
    restart: "no"

  api:
    build: .
    restart: unless-stopped
    depends_on:
      migrate:
        condition: service_completed_successfully
    environment:
      NODE_ENV: production
      PORT: "4000"
      DATABASE_URL: postgres://agriconnect:agriconnect_dev_password@db:5432/agriconnect
      # --- Override every one of these in production. Never ship these values. ---
      JWT_ACCESS_SECRET: change-me-access-secret-at-least-32-characters
      JWT_REFRESH_SECRET: change-me-refresh-secret-at-least-32-characters
      ACCESS_TOKEN_TTL: 15m
      REFRESH_TOKEN_TTL: 30d
      BCRYPT_ROUNDS: "12"
      CORS_ORIGINS: http://localhost:3000
      PUBLIC_BASE_URL: http://localhost:4000
      # No real delivery provider is configured; the API refuses to start in
      # production with OUTBOX/NONE, so this compose file is for local use only.
      DELIVERY_PROVIDER: OUTBOX
      EXPOSE_DEV_CODES: "true"
      GEE_ENABLED: "false"
    ports:
      - "4000:4000"

volumes:
  agri_pgdata:
