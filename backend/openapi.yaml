                quantity: { type: number, exclusiveMinimum: 0 }
                note: { type: string, nullable: true }
      responses:
        '201':
          description: Order placed
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Order' }
        '400': { $ref: '#/components/responses/ValidationError' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '409':
          description: Insufficient stock
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ErrorEnvelope' }
    get:
      tags: [Orders]
      summary: List own orders (buyer) or orders on own listings (farm owner)
      parameters:
        - $ref: '#/components/parameters/Page'
        - $ref: '#/components/parameters/PageSize'
      responses:
        '200':
          description: Paginated orders
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/PageMeta'
                  - type: object
                    properties:
                      items:
                        type: array
                        items: { $ref: '#/components/schemas/Order' }
        '403': { $ref: '#/components/responses/Forbidden' }

  /orders/{id}:
    parameters:
      - $ref: '#/components/parameters/ResourceId'
    get:
      tags: [Orders]
      summary: Get one order (its buyer or the seller)
      responses:
        '200':
          description: Order
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Order' }
        '404': { $ref: '#/components/responses/NotFound' }

  /orders/{id}/confirm:
    parameters:
      - $ref: '#/components/parameters/ResourceId'
    post:
      tags: [Orders]
      summary: Confirm a pending order (farm owner)
      responses:
        '200':
          description: Confirmed
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Order' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409':
          description: Not pending
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ErrorEnvelope' }

  /orders/{id}/reject:
    parameters:
      - $ref: '#/components/parameters/ResourceId'
    post:
      tags: [Orders]
      summary: Reject a pending order (farm owner)
      description: Stock is restored to the listing.
      responses:
        '200':
          description: Rejected
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Order' }
        '409':
          description: Not pending
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ErrorEnvelope' }

  /orders/{id}/cancel:
    parameters:
      - $ref: '#/components/parameters/ResourceId'
    post:
      tags: [Orders]
      summary: Cancel a pending order (buyer owner)
      responses:
        '200':
          description: Cancelled
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Order' }
        '409':
          description: Not pending
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ErrorEnvelope' }

  /orders/{id}/complete:
    parameters:
      - $ref: '#/components/parameters/ResourceId'
    post:
      tags: [Orders]
      summary: Complete a confirmed order (farm owner)
      responses:
        '200':
          description: Completed
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Order' }
        '409':
          description: Not confirmed
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ErrorEnvelope' }

  /notifications:
    get:
      tags: [Notifications]
      summary: The caller's notification feed, newest first
      parameters:
        - name: unreadOnly
          in: query
          schema: { type: string, enum: ['true', 'false'] }
        - $ref: '#/components/parameters/Page'
        - $ref: '#/components/parameters/PageSize'
      responses:
        '200':
          description: Paginated notifications
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/PageMeta'
                  - type: object
                    properties:
                      items:
                        type: array
                        items: { $ref: '#/components/schemas/Notification' }

  /notifications/{id}/read:
    parameters:
      - $ref: '#/components/parameters/ResourceId'
    patch:
      tags: [Notifications]
      summary: Mark one owned notification as read
      responses:
        '200':
          description: Updated notification
          content:
            application/json:
              schema:
                type: object
                properties:
                  notification: { $ref: '#/components/schemas/Notification' }
        '404': { $ref: '#/components/responses/NotFound' }

  /notifications/read-all:
    post:
      tags: [Notifications]
      summary: Mark every unread notification as read
      responses:
        '200':
          description: Count of updated rows
          content:
            application/json:
              schema:
                type: object
                properties:
                  updated: { type: integer }

  /notifications/devices:
    post:
      tags: [Notifications]
      summary: Register a push-notification token
      description: |
        Idempotent on `(userId, token)`. Note: the Android `ApiService` currently
        posts to `/devices`, which does not exist — the live path is
        `/notifications/devices`.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [token]
              properties:
                token: { type: string, maxLength: 4096 }
                platform: { type: string, default: android, maxLength: 40 }
      responses:
        '204': { description: Registered }

  /sync/push:
    post:
      tags: [Sync]
      summary: Push a batch of queued local writes
      description: |
        Always returns `200` — the batch was accepted regardless of individual item
        outcomes. One transaction per item, processed in order. Conflicts follow
        Last-Write-Wins: the newer server copy is returned rather than overwritten.
      parameters:
        - $ref: '#/components/parameters/IdempotencyKey'
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/SyncPushRequest' }
      responses:
        '200':
          description: Per-item outcomes
          content:
            application/json:
              schema: { $ref: '#/components/schemas/SyncPushResponse' }
        '429': { $ref: '#/components/responses/RateLimited' }

  /sync/pull:
    get:
      tags: [Sync]
      summary: Pull server-authoritative deltas since a timestamp
      parameters:
        - name: since
          in: query
          schema: { type: string, format: date-time }
      responses:
        '200':
          description: Changes for the caller's scope
          content:
            application/json:
              schema: { $ref: '#/components/schemas/SyncPullResponse' }

  /health:
    servers:
      - url: /
    get:
      tags: [Health]
      summary: Liveness/readiness probe
      description: Unauthenticated. Lives at the host root, not under `/api/v1`.
      security: []
      responses:
        '200':
          description: Healthy
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Health' }
        '503':
          description: Database unreachable (degraded)
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Health' }

components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT

  parameters:
    ResourceId:
      name: id
      in: path
      required: true
      schema: { type: string, format: uuid }
    Page:
      name: page
      in: query
      schema: { type: integer, minimum: 1, default: 1 }
    PageSize:
      name: pageSize
      in: query
      schema: { type: integer, minimum: 1, maximum: 100, default: 20 }
    IdempotencyKey:
      name: Idempotency-Key
      in: header
      required: false
      schema: { type: string }
      description: Repeated calls with the same key return the original result.

  responses:
    Unauthorized:
      description: Missing, invalid or expired credentials
      content:
        application/json:
          schema: { $ref: '#/components/schemas/ErrorEnvelope' }
    Forbidden:
      description: Role, ownership or account-status check failed
      content:
        application/json:
          schema: { $ref: '#/components/schemas/ErrorEnvelope' }
    NotFound:
      description: Resource not found (also used to hide others' resources)
      content:
        application/json:
          schema: { $ref: '#/components/schemas/ErrorEnvelope' }
    ValidationError:
      description: Request failed validation
      content:
        application/json:
          schema: { $ref: '#/components/schemas/ErrorEnvelope' }
    RateLimited:
      description: Too many requests
      content:
        application/json:
          schema: { $ref: '#/components/schemas/ErrorEnvelope' }

  schemas:
    Health:
      type: object
      properties:
        status: { type: string, enum: [ok, degraded] }
        version: { type: string, example: 1.0.0 }
        time: { type: string, format: date-time }

    ErrorEnvelope:
      type: object
      required: [error]
      properties:
        error:
          type: object
          required: [code, message]
          properties:
            code:
              type: string
              example: VALIDATION_ERROR
            message: { type: string }
            details:
              type: array
              nullable: true
              items:
                type: object
                properties:
                  field: { type: string }
                  message: { type: string }
        requestId: { type: string }

    Message:
      type: object
      required: [message]
      properties:
        message: { type: string }

    NotificationPreferences:
      type: object
      properties:
        orders: { type: boolean }
        sync: { type: boolean }
        satellite: { type: boolean }
        marketplace: { type: boolean }

    User:
      type: object
      required: [userId, fullName, phoneNumber, role, accountStatus, createdAt, updatedAt]
      properties:
        userId: { type: string, format: uuid }
        fullName: { type: string }
        phoneNumber: { type: string }
        email: { type: string, nullable: true }
        role: { type: string, enum: [FARM_OWNER, FARMER, BUYER] }
        accountStatus:
          type: string
          enum: [REGISTERED, UNVERIFIED, VERIFIED, SUSPENDED, PENDING_DELETION, DELETED]
        avatarUrl: { type: string, nullable: true }
        notificationPreferences: { $ref: '#/components/schemas/NotificationPreferences' }
        verifiedAt: { type: string, format: date-time, nullable: true }
        createdAt: { type: string, format: date-time }
        updatedAt: { type: string, format: date-time }

    RegisterRequest:
      type: object
      required: [fullName, phoneNumber, password, role]
      properties:
        fullName: { type: string }
        phoneNumber: { type: string }
        email: { type: string, format: email, nullable: true }
        password: { type: string, minLength: 8 }
        role: { type: string, enum: [FARM_OWNER, FARMER, BUYER] }
        acceptTerms: { type: boolean, default: true }
        acceptPrivacy: { type: boolean, default: true }

    LoginRequest:
      type: object
      required: [identifier, password]
      properties:
        identifier: { type: string, description: Phone number or email }
        password: { type: string }

    IdentifierRequest:
      type: object
      required: [identifier]
      properties:
        identifier: { type: string }

    VerifyCodeRequest:
      type: object
      required: [identifier, code]
      properties:
        identifier: { type: string }
        code: { type: string }

    TokenPair:
      type: object
      required: [accessToken, refreshToken, expiresIn]
      properties:
        accessToken: { type: string }
        refreshToken: { type: string }
        expiresIn: { type: integer, description: Access-token lifetime in seconds }

    AuthSession:
      allOf:
        - $ref: '#/components/schemas/TokenPair'
        - type: object
          required: [user]
          properties:
            user: { $ref: '#/components/schemas/User' }
            devVerificationCode:
              type: string
              nullable: true
              description: Development-only; present only when EXPOSE_DEV_CODES is set.

    DeletionRequest:
      type: object
      properties:
        requestId: { type: string, format: uuid }
        status: { type: string, enum: [PENDING, PROCESSING, COMPLETED, CANCELLED] }
        reason: { type: string, nullable: true }
        requestedAt: { type: string, format: date-time, nullable: true }
        effectiveAt: { type: string, format: date-time, nullable: true }
        anonymisedAt: { type: string, format: date-time, nullable: true }
        completedAt: { type: string, format: date-time, nullable: true }
        cancelledAt: { type: string, format: date-time, nullable: true }
        retention:
          type: array
          items: { $ref: '#/components/schemas/RetentionItem' }

    RetentionItem:
      type: object
      properties:
        dataCategory: { type: string }
        justification: { type: string }
        retainUntil: { type: string, format: date, nullable: true }

    FarmPlot:
      type: object
      properties:
        plotId: { type: string, format: uuid }
        clientId: { type: string, nullable: true }
        farmerId: { type: string, format: uuid }
        plotName: { type: string }
        areaHectares: { type: number, nullable: true }
        geoJsonBoundary: { type: string, nullable: true, description: GeoJSON stored as a string }
        centroidLat: { type: number, nullable: true }
        centroidLng: { type: number, nullable: true }
        notes: { type: string, nullable: true }
        createdAt: { type: string, format: date-time }
        updatedAt: { type: string, format: date-time }

    FarmPlotCreate:
      type: object
      required: [plotName]
      properties:
        plotName: { type: string }
        areaHectares: { type: number, nullable: true }
        geoJsonBoundary: { type: object, nullable: true }
        notes: { type: string, nullable: true }
        clientId: { type: string, nullable: true }

    HarvestRecord:
      type: object
      properties:
        harvestId: { type: string, format: uuid }
        clientId: { type: string, nullable: true }
        farmerId: { type: string, format: uuid }
        plotId: { type: string, format: uuid, nullable: true }
        cropType: { type: string }
        quantityKg: { type: number, nullable: true }
        harvestDate: { type: string, format: date, nullable: true }
        notes: { type: string, nullable: true }
        createdAt: { type: string, format: date-time }
        updatedAt: { type: string, format: date-time }

    HarvestCreate:
      type: object
      required: [cropType, quantityKg, harvestDate]
      properties:
        cropType: { type: string }
        quantityKg: { type: number }
        harvestDate: { type: string, format: date }
        plotId: { type: string, format: uuid, nullable: true }
        notes: { type: string, nullable: true }
        clientId: { type: string, nullable: true }

    LivestockCount:
      type: object
      properties:
        countId: { type: string, format: uuid }
        clientId: { type: string, nullable: true }
        farmerId: { type: string, format: uuid }
        animalType: { type: string }
        headCount: { type: integer, nullable: true }
        recordDate: { type: string, format: date, nullable: true }
        notes: { type: string, nullable: true }
        createdAt: { type: string, format: date-time }
        updatedAt: { type: string, format: date-time }

    LivestockCreate:
      type: object
      required: [animalType, headCount, recordDate]
      properties:
        animalType: { type: string }
        headCount: { type: integer, minimum: 0 }
        recordDate: { type: string, format: date }
        notes: { type: string, nullable: true }
        clientId: { type: string, nullable: true }

    SaleTransaction:
      type: object
      properties:
        transactionId: { type: string, format: uuid }
        clientId: { type: string, nullable: true }
        farmerId: { type: string, format: uuid }
        item: { type: string }
        quantity: { type: number, nullable: true }
        unitPrice: { type: number, nullable: true }
        amount: { type: number }
        currency: { type: string, example: BWP }
        buyerName: { type: string, nullable: true }
        date: { type: string, format: date, nullable: true }
        notes: { type: string, nullable: true }
        createdAt: { type: string, format: date-time }
        updatedAt: { type: string, format: date-time }

    SaleCreate:
      type: object
      required: [item, amount, date]
      properties:
        item: { type: string }
        quantity: { type: number, nullable: true }
        unitPrice: { type: number, nullable: true }
        amount: { type: number }
        buyerName: { type: string, nullable: true }
        date: { type: string, format: date }
        notes: { type: string, nullable: true }
        clientId: { type: string, nullable: true }

    Expense:
      type: object
      properties:
        expenseId: { type: string, format: uuid }
        clientId: { type: string, nullable: true }
        farmerId: { type: string, format: uuid }
        category: { type: string }
        description: { type: string, nullable: true }
        amount: { type: number }
        currency: { type: string, example: BWP }
        expenseDate: { type: string, format: date, nullable: true }
        createdAt: { type: string, format: date-time }
        updatedAt: { type: string, format: date-time }

    ExpenseCreate:
      type: object
      required: [category, amount, expenseDate]
      properties:
        category: { type: string }
        description: { type: string, nullable: true }
        amount: { type: number }
        expenseDate: { type: string, format: date }
        clientId: { type: string, nullable: true }

    FinanceSummary:
      type: object
      properties:
        totalSales: { type: number }
        totalExpenses: { type: number }
        netBalance: { type: number }
        currency: { type: string, example: BWP }
        series:
          type: array
          items:
            type: object
            properties:
              period: { type: string, example: '2026-01' }
              sales: { type: number }
              expenses: { type: number }

    NdviRecord:
      type: object
      properties:
        ndviId: { type: string, format: uuid }
        plotId: { type: string, format: uuid, nullable: true }
        farmerId: { type: string, format: uuid }
        satelliteDate: { type: string, format: date, nullable: true }
        meanNdviValue: { type: number, nullable: true }
        stressLevel:
          type: string
          nullable: true
          enum: [HIGH_STRESS, MODERATE_STRESS, HEALTHY_VEGETATION]
        status:
          type: string
          enum: [REQUESTED, FETCHING_IMAGERY, COMPUTING_NDVI, GENERATED, FAILED]
        failureReason: { type: string, nullable: true }
        cloudCover: { type: number, nullable: true }
        compressedVectorJson: { type: string, nullable: true }
        isCached: { type: boolean }
        source: { type: string, example: SENTINEL-2 }
        createdAt: { type: string, format: date-time }
        advice:
          allOf: [{ $ref: '#/components/schemas/NdviAdvice' }]
          nullable: true
      description: |
        `status` may be `FAILED` (for example cloud cover > 80%) with
        `meanNdviValue: null`. NDVI is not presented as a definitive agronomic
        diagnosis.

        `advice` is present on a fresh computation, on the latest observation and on
        a single record; it is `null` on history items, while a computation is in
        flight, and on a failure. `source` is `MOCK` when Earth Engine is not
        configured — every MOCK value is a demonstration value, and the advice says so.

    NdviAdvice:
      type: object
      description: |
        Guidance attached to a generated reading. General guidance derived from a
        vegetation index — not a site-specific agronomic recommendation.
      properties:
        assessment: { $ref: '#/components/schemas/NdviAssessment' }
        priority:
          type: string
          enum: [NOW, SOON, ROUTINE]
          description: How urgently the guidance should be read.
        actions:
          type: array
          items: { $ref: '#/components/schemas/NdviAction' }
        watchFor:
          type: array
          items: { type: string }
          description: What to look for in the field, not a diagnosis.
        trend: { $ref: '#/components/schemas/NdviTrend' }
        context: { $ref: '#/components/schemas/NdviAdviceContext' }
        confidence: { $ref: '#/components/schemas/NdviConfidence' }
        scaleGuide:
          type: array
          description: The published NDVI ranges, so the number can be read without trusting a colour.
          items: { $ref: '#/components/schemas/NdviScaleRow' }
        limits:
          type: array
          items: { type: string }
          description: What a vegetation index cannot tell a farmer.
        disclaimer: { type: string }

    NdviAssessment:
      type: object
      properties:
        value: { type: number }
        stressLevel: { type: string, enum: [HIGH_STRESS, MODERATE_STRESS, HEALTHY_VEGETATION] }
        label: { type: string, example: High stress }
        colour: { type: string, enum: [success, warning, error, neutral] }
        headline: { type: string, example: Act now — crop vigour is very low }
        meaning: { type: string }
        band: { $ref: '#/components/schemas/NdviBand' }
        summary: { type: string }

    NdviBand:
      type: object
      properties:
        min: { type: number }
        max: { type: number, nullable: true }

    NdviAction:
      type: object
      properties:
        title: { type: string }
        detail: { type: string }

    NdviTrend:
      type: object
      description: Direction of travel against the plot's previous generated reading.
      properties:
        direction: { type: string, enum: [FIRST_READING, IMPROVING, DECLINING, STABLE] }
        delta: { type: number, nullable: true }
        previousValue: { type: number, nullable: true }
        previousDate: { type: string, format: date, nullable: true }
        note: { type: string }

    NdviAdviceContext:
      type: object
      description: The facts the reading is true under, so it can be checked rather than trusted blindly.
      properties:
        plotName: { type: string, nullable: true }
        areaHectares: { type: number, nullable: true }
        observedOn: { type: string, format: date, nullable: true }
        daysSinceObservation: { type: integer, nullable: true }
        cloudCoverPercent: { type: number, nullable: true }
        source: { type: string, nullable: true }
        sourceIsSimulated: { type: boolean }

    NdviConfidence:
      type: object
      description: How far the measurement can be trusted — about the data, never about the crop.
      properties:
        level: { type: string, enum: [HIGH, MEDIUM, LOW] }
        note: { type: string }

    NdviScaleRow:
      type: object
      properties:
        range: { type: string, example: '0.20 – 0.45' }
        meaning: { type: string }

    ProduceListing:
      type: object
      properties:
        listingId: { type: string, format: uuid }
        farmerId: { type: string, format: uuid }
        produce: { type: string }
        description: { type: string, nullable: true }
        quantity: { type: number }
        reservedQty: { type: number }
        soldQty: { type: number }
        availableQty: { type: number }
        unit: { $ref: '#/components/schemas/ListingUnit' }
        price: { type: number }
        currency: { type: string, example: BWP }
        status:
          type: string
          enum: [DRAFT, PENDING_PUBLISH, SYNCING, RETRY, PUBLISHED, SOLD]
        imageUrl: { type: string, nullable: true }
        locationText: { type: string, nullable: true }
        publishedAt: { type: string, format: date-time, nullable: true }
        createdAt: { type: string, format: date-time }
        updatedAt: { type: string, format: date-time }
        farmerName: { type: string }

    ListingCreate:
      type: object
      required: [produce, quantity, unit, price]
      properties:
        produce: { type: string }
        description: { type: string, nullable: true }
        quantity: { type: number }
        unit: { $ref: '#/components/schemas/ListingUnit' }
        price: { type: number }
        imageUrl: { type: string, nullable: true }
        locationText: { type: string, nullable: true }

    # What a listing is measured in. `head` is one animal ("20 head of cattle");
    # `herd` and `flock` sell a whole group as a single lot (quantity 1, one price).
    # The list mirrors the DB CHECK constraint (migrations/003 + 008) and
    # LISTING_UNITS in src/modules/marketplace/marketplace.schemas.js.
    ListingUnit:
      type: string
      enum: [kg, tonne, bag, crate, bunch, litre, head, herd, flock]

    Order:
      type: object
      properties:
        orderId: { type: string, format: uuid }
        listingId: { type: string, format: uuid }
        buyerId: { type: string, format: uuid }
        farmerId: { type: string, format: uuid }
        quantity: { type: number }
        unitPrice: { type: number }
        totalPrice: { type: number }
        currency: { type: string, example: BWP }
        status:
          type: string
          enum: [PENDING, CONFIRMED, REJECTED, CANCELLED, COMPLETED]
        note: { type: string, nullable: true }
        buyerContact: { type: string, nullable: true }
        farmerDecisionAt: { type: string, format: date-time, nullable: true }
        createdAt: { type: string, format: date-time }
        updatedAt: { type: string, format: date-time }
        produce: { type: string }
        buyerName: { type: string }

    Notification:
      type: object
      properties:
        notificationId: { type: string, format: uuid }
        userId: { type: string, format: uuid }
        type: { type: string }
        title: { type: string }
        body: { type: string }
        relatedEntityType: { type: string, nullable: true }
        relatedEntityId: { type: string, nullable: true }
        isRead: { type: boolean }
        createdAt: { type: string, format: date-time }

    PageMeta:
      type: object
      required: [items, page, pageSize, total, hasMore]
      properties:
        items: { type: array, items: {} }
        page: { type: integer }
        pageSize: { type: integer }
        total: { type: integer }
        hasMore: { type: boolean }

    SyncPushRequest:
      type: object
      required: [items]
      properties:
        items:
          type: array
          items: { $ref: '#/components/schemas/SyncItem' }
        deviceId: { type: string, nullable: true }

    SyncItem:
      type: object
      required: [queueId, entityType, operation, clientTimestamp]
      properties:
        queueId: { type: string, description: Client-generated UUID; the idempotency key per item }
        entityType:
          type: string
          description: Registered synchronisable entity, e.g. SaleTransaction, HarvestRecord, FarmPlot.
        entityId: { type: string, nullable: true }
        operation: { type: string, enum: [CREATE, UPDATE, DELETE] }
        payload:
          oneOf:
            - type: string
              description: JSON-encoded object
            - type: object
        clientTimestamp: { type: string, format: date-time }
        retryCount: { type: integer, default: 0 }

    SyncPushResponse:
      type: object
      properties:
        serverTime: { type: string, format: date-time }
        results:
          type: array
          items: { $ref: '#/components/schemas/SyncResult' }

    SyncResult:
      type: object
      properties:
        queueId: { type: string }
        status: { type: string, enum: [SYNCED, CONFLICT, FAILED] }
        serverEntityId: { type: string, nullable: true }
        serverUpdatedAt: { type: string, format: date-time, nullable: true }
        serverEntity:
          type: object
          nullable: true
          description: Present on CONFLICT — the newer authoritative server copy.
        reason:
          type: string
          nullable: true
          enum: [FORBIDDEN, VALIDATION_ERROR, UNKNOWN_ENTITY_TYPE, NOT_FOUND, INTERNAL]

    SyncPullResponse:
      type: object
      properties:
        serverTime: { type: string, format: date-time }
        changes:
          type: object
          properties:
            plots: { type: array, items: { $ref: '#/components/schemas/FarmPlot' } }
            harvests: { type: array, items: { $ref: '#/components/schemas/HarvestRecord' } }
            livestock: { type: array, items: { $ref: '#/components/schemas/LivestockCount' } }
            sales: { type: array, items: { $ref: '#/components/schemas/SaleTransaction' } }
            expenses: { type: array, items: { $ref: '#/components/schemas/Expense' } }
            listings: { type: array, items: { $ref: '#/components/schemas/ProduceListing' } }
            orders: { type: array, items: { $ref: '#/components/schemas/Order' } }
            notifications: { type: array, items: { $ref: '#/components/schemas/Notification' } }
            ndvi: { type: array, items: { $ref: '#/components/schemas/NdviRecord' } }

    # =========================================================================
    # Satellite Monitoring (new unified dashboard)
    # =========================================================================

    PlotGeometry:
      type: object
      description: Plot boundary with computed area, perimeter and centroid.
      properties:
        method: { type: string, enum: [RECTANGLE, POLYGON] }
        vertices:
          type: array
          description: WGS-84 coordinates [lon, lat] of the boundary ring (closed).
          items:
            type: array
            items: { type: number }
            minItems: 2
            maxItems: 2
        areaM2: { type: number, description: Area in square metres (from actual geometry). }
        areaHectares: { type: number, description: Area in hectares. }
        perimeterM: { type: number, description: Perimeter in metres. }
        centroid:
          type: array
          items: { type: number }
          minItems: 2
          maxItems: 2
          description: Centroid [lon, lat].
        sideLengthsM:
          type: array
          items: { type: number }
          description: Side lengths in metres (RECTANGLE only).

    PlotObservation:
      type: object
      description: One clean observation row (date, NDVI, EVI, quality).
      properties:
        observationId: { type: string, format: uuid }
        plotId: { type: string, format: uuid }
        farmerId: { type: string, format: uuid }
        observedOn: { type: string, format: date }
        ndvi: { type: number, nullable: true }
        evi: { type: number, nullable: true }
        smoothedNdvi: { type: number, nullable: true }
        smoothedEvi: { type: number, nullable: true }
        validPixelPct: { type: number, nullable: true }
        cloudCoverPct: { type: number, nullable: true }
        pixelCount: { type: integer, nullable: true }
        quality: { type: string, enum: [GOOD, FAIR, POOR] }
        isOutlier: { type: boolean }
        isSimulated: { type: boolean }
        source: { type: string, nullable: true }
        createdAt: { type: string, format: date-time }
        updatedAt: { type: string, format: date-time }

    ObservationStatus:
      type: object
      description: Provenance and freshness of the observation series.
      properties:
        isCached: { type: boolean }
        isSimulated: { type: boolean }
        newestObservation: { type: string, format: date, nullable: true }
        newestObservationAgeDays: { type: integer, nullable: true }
        provider: { type: string, nullable: true }
        providerError: { type: string, nullable: true }
        note: { type: string, nullable: true }

    GrowthCycleEvent:
      type: object
      description: Key phenological dates estimated from the smoothed series.
      properties:
        greenUp: { type: string, format: date, nullable: true }
        peak: { type: string, format: date, nullable: true }
        endOfSeason: { type: string, format: date, nullable: true }
        greenUpConfidence: { type: string, enum: [HIGH, MEDIUM, LOW], nullable: true }
        peakConfidence: { type: string, enum: [HIGH, MEDIUM, LOW], nullable: true }
        endOfSeasonConfidence: { type: string, enum: [HIGH, MEDIUM, LOW], nullable: true }
        note: { type: string }

    VegetationDrop:
      type: object
      description: |
        A detected drop with possible explanations — never a confirmed diagnosis.
        The classification is one of the restricted set and the label explains the
        uncertainty. A drop alone is never labelled harvest, drought, disease or
        crop failure.
      properties:
        date: { type: string, format: date }
        index: { type: string, enum: [NDVI, EVI] }
        magnitude: { type: number }
        valueBefore: { type: number }
        valueAfter: { type: number }
        classification:
          type: string
          enum: [NOISE, POSSIBLE_HARVEST, POSSIBLE_HEAT_STRESS, GRADUAL_DECLINE, UNCLEAR]
        label: { type: string }
        evidence: { type: object }
        confidence: { type: string, enum: [HIGH, MEDIUM, LOW] }
        nextStep: { type: string }
        weatherContext: { type: object, nullable: true }
        detectedEventId: { type: string, format: uuid, nullable: true }

    PlotEvent:
      type: object
      description: Farmer event log entry (confirmed or corrected by the farmer).
      properties:
        eventId: { type: string, format: uuid }
        plotId: { type: string, format: uuid }
        farmerId: { type: string, format: uuid }
        eventDate: { type: string, format: date }
        kind:
          type: string
          enum: [DETECTED_DROP, HARVEST, CLEARING, HEAT_STRESS, WATER_STRESS, OBSERVATION, OTHER]
        source: { type: string, enum: [FARMER, SYSTEM] }
        classification: { type: string, nullable: true }
        confirmed: { type: boolean }
        notes: { type: string, nullable: true }
        ndviBefore: { type: number, nullable: true }
        ndviAfter: { type: number, nullable: true }
        magnitude: { type: number, nullable: true }
        confidence: { type: string, enum: [HIGH, MEDIUM, LOW], nullable: true }
        evidence: { type: object, nullable: true }
        weatherContext: { type: object, nullable: true }
        recordedBy: { type: string, format: uuid, nullable: true }
        createdAt: { type: string, format: date-time }
        updatedAt: { type: string, format: date-time }

    PlotAlert:
      type: object
      description: Deduplicated alert with acknowledgement/dismissal workflow.
      properties:
        alertId: { type: string, format: uuid }
        plotId: { type: string, format: uuid }
        farmerId: { type: string, format: uuid }
        alertKey: { type: string }
        alertType: { type: string }
        severity: { type: string, enum: [INFO, WARNING, CRITICAL] }
        title: { type: string }
        body: { type: string }
        status: { type: string, enum: [OPEN, ACKNOWLEDGED, DISMISSED] }
        raisedAt: { type: string, format: date-time }
        resolvedAt: { type: string, format: date-time, nullable: true }
        acknowledgedAt: { type: string, format: date-time, nullable: true }
        dismissedAt: { type: string, format: date-time, nullable: true }
        createdAt: { type: string, format: date-time }
        updatedAt: { type: string, format: date-time }

    WeatherData:
      type: object
      description: Weather series from Open-Meteo (modelled, not measured). Unavailable provider reports `available:false` with a `reason`.
      properties:
        available: { type: boolean }
        reason: { type: string, nullable: true }
        source: { type: string, example: Open-Meteo }
        dataType: { type: string, enum: [MEASURED, MODELLED, ESTIMATED] }
        cached: { type: boolean }
        fetchedAt: { type: string, format: date-time, nullable: true }
        note: { type: string, nullable: true }
        daily:
          type: array
          items:
            type: object
            properties:
              date: { type: string, format: date }
              rainfallMm: { type: number, nullable: true }
              tempMinC: { type: number, nullable: true }
              tempMaxC: { type: number, nullable: true }
              tempMeanC: { type: number, nullable: true }
              soilMoisturePct: { type: number, nullable: true }
        summary:
          type: object
          properties:
            periodStart: { type: string, format: date }
            periodEnd: { type: string, format: date }
            rainfall7dMm: { type: number, nullable: true }
            rainfall14dMm: { type: number, nullable: true }
            tempMax7dC: { type: number, nullable: true }
            tempMin7dC: { type: number, nullable: true }
            avgTemp7dC: { type: number, nullable: true }
            soilMoistureMeanPct: { type: number, nullable: true }

    WeatherResponse:
      type: object
      description: Weather endpoint envelope.
      properties:
        plotId: { type: string, format: uuid }
        weather: { $ref: '#/components/schemas/WeatherData' }
        source: { type: string, nullable: true }
        dataType: { type: string, nullable: true }

    SatelliteOverview:
      type: object
      description: Complete satellite monitoring dashboard for one plot.
      properties:
        plot: { $ref: '#/components/schemas/PlotRef' }
        geometry: { $ref: '#/components/schemas/PlotGeometry' }
        observationStatus: { $ref: '#/components/schemas/ObservationStatus' }
        observations:
          type: array
          items: { $ref: '#/components/schemas/PlotObservation' }
        summary: { $ref: '#/components/schemas/NdviSummary' }
        eviSummary: { $ref: '#/components/schemas/EviSummary' }
        growthCycle: { $ref: '#/components/schemas/GrowthCycleEvent' }
        drops:
          type: array
          items: { $ref: '#/components/schemas/VegetationDrop' }
        weather: { $ref: '#/components/schemas/WeatherData' }
        alerts:
          type: array
          items: { $ref: '#/components/schemas/PlotAlert' }
        quality:
          type: object
          properties:
            readingsReceived: { type: integer }
            readingsUsable: { type: integer }
            readingsRejected: { type: integer }
            outliers: { type: integer }
            note: { type: string, nullable: true }
        modelStatus:
          type: object
          properties:
            trained: { type: boolean }
            readyToTrain: { type: boolean }
            labelledEvents: { type: integer }
            requiredLabels: { type: integer }
            note: { type: string, nullable: true }
        thresholds: { $ref: '#/components/schemas/AlertThresholds' }
        thresholdDocumentation: { type: string }
        disclaimer: { type: string }
        generatedAt: { type: string, format: date-time }

    PlotRef:
      type: object
      description: Compact plot reference used by the overview and latest endpoints.
      properties:
        plotId: { type: string, format: uuid }
        plotName: { type: string }
        areaHectares: { type: number, nullable: true }
        centroidLat: { type: number, nullable: true }
        centroidLng: { type: number, nullable: true }
        geoJsonBoundary: { type: object, nullable: true }
        imageUrl: { type: string, nullable: true }

    NdviSummary:
      type: object
      description: Statistics for the NDVI column. `summary` is NDVI-only; `eviSummary` is the same shape for EVI.
      properties:
        available: { type: boolean }
        reason: { type: string, nullable: true }
        index: { type: string, example: NDVI }
        count: { type: integer }
        latest: { type: object, nullable: true }
        previous: { type: object, nullable: true }
        min: { type: number, nullable: true }
        max: { type: number, nullable: true }
        average: { type: number, nullable: true }
        change: { type: number, nullable: true }
        changePct: { type: number, nullable: true }
        trend: { type: string, enum: [RISING, STABLE, DECLINING, INSUFFICIENT] }
        dataAgeDays: { type: integer, nullable: true }
        firstDate: { type: string, format: date, nullable: true }
        lastDate: { type: string, format: date, nullable: true }
        coverageFrom: { type: string, format: date, nullable: true }
        coverageTo: { type: string, format: date, nullable: true }

    EviSummary:
      $ref: '#/components/schemas/NdviSummary'

    PlotSummary:
      type: object
      description: Compact per-plot summary (`GET /satellite/plots/latest`).
      properties:
        plotId: { type: string, format: uuid }
        observedOn: { type: string, format: date, nullable: true }
        ndvi: { type: number, nullable: true }
        evi: { type: number, nullable: true }
        quality: { type: string, nullable: true }
        isSimulated: { type: boolean, nullable: true }
        source: { type: string, nullable: true }

    ColourMap:
      type: object
      description: |
        Per-pixel colour map for a plot's newest reading (`GET /satellite/colour-map`).
        `grid` is row-major; a `null` cell is **outside the plot boundary** and must
        be left blank, never drawn as a low value. When `available` is false, `reason`
        explains why and `grid` is empty.
      properties:
        available: { type: boolean }
        reason: { type: string, nullable: true }
        index: { type: string, enum: [ndvi, evi] }
        plotId: { type: string, format: uuid, nullable: true }
        plotName: { type: string, nullable: true }
        observedOn: { type: string, format: date, nullable: true }
        meanValue:
          type: number
          nullable: true
          description: The measured field-average index. The grid's in-boundary average equals this.
        isSimulated:
          type: boolean
          description: True when the mean itself is demonstration (MOCK) data.
        variationSimulated:
          type: boolean
          description: Always true. The pattern across the grid is a simulated texture, not a per-pixel observation.
        grid:
          type: array
          items:
            type: array
            items: { type: number, nullable: true }
        size: { type: integer, description: Grid resolution per side. }
        stats:
          type: object
          nullable: true
          properties:
            mean: { type: number, nullable: true }
            gridMean: { type: number, nullable: true }
            min: { type: number, nullable: true }
            max: { type: number, nullable: true }
            insideCells: { type: integer }
            spread: { type: number, nullable: true }
        coverage:
          type: object
          nullable: true
          properties:
            insideCells: { type: integer }
            totalCells: { type: integer }
            validPixelPct: { type: number, nullable: true }
            note: { type: string, nullable: true }
        scale:
          type: object
          nullable: true
          properties:
            min: { type: number }
            max: { type: number }
        legend:
          type: array
          items:
            type: object
            properties:
              from: { type: number, nullable: true }
              to: { type: number, nullable: true }
              colour: { type: string, nullable: true, example: '#2E7D4F' }
              label: { type: string, nullable: true }
        note: { type: string, nullable: true }
        disclaimer: { type: string, nullable: true }
        interpretation:
          type: string
          nullable: true
          description: Plain-language reading of the field average.
        geoJsonBoundary: { type: object, nullable: true }
        hasBoundary: { type: boolean }
        observationCount: { type: integer }
        ageDays: { type: integer, nullable: true }
        isStale: { type: boolean }
        staleDays: { type: integer, nullable: true }
        latest:
          type: object
          nullable: true
          properties:
            date: { type: string, format: date, nullable: true }
            value: { type: number, nullable: true }
            validPixelPct: { type: number, nullable: true }
            cloudCoverPct: { type: number, nullable: true }
            quality: { type: string, nullable: true }
            source: { type: string, nullable: true }
            isSimulated: { type: boolean, nullable: true }

    AlertsByFarm:
      type: object
      description: |
        Farm-wide attention summary (`GET /satellite/alerts/by-farm`). Every live
        plot is present, including plots with no data at all, which are flagged
        `noData: true` rather than omitted.
      properties:
        plots:
          type: array
          items: { $ref: '#/components/schemas/FarmAlertPlot' }
        farms:
          type: array
          items: { $ref: '#/components/schemas/FarmAlertGroup' }
        totals:
          type: object
          properties:
            plots: { type: integer }
            plotsNeedingAttention: { type: integer }
            plotsWithNoData: { type: integer }
            plotsStale: { type: integer }
            openAlerts: { type: integer }
            farmsAffected: { type: integer }
        thresholds: { $ref: '#/components/schemas/AlertThresholds' }
        note: { type: string, nullable: true }

    FarmAlertGroup:
      type: object
      properties:
        farmId: { type: string, format: uuid, nullable: true }
        farmName: { type: string, nullable: true }
        plots:
          type: array
          items: { $ref: '#/components/schemas/FarmAlertPlot' }
        openAlertCount: { type: integer }
        plotsNeedingAttention: { type: integer }

    FarmAlertPlot:
      type: object
      description: |
        One plot's place in the farm-wide list. `noData`, `isStale` and open alerts
        are three distinct attention states; a plot in none of them has
        `needsAttention: false` and a null `reason`.
      properties:
        plotId: { type: string, format: uuid }
        plotName: { type: string, nullable: true }
        farmId: { type: string, format: uuid, nullable: true }
        farmName: { type: string, nullable: true }
        areaHectares: { type: number, nullable: true }
        openAlertCount: { type: integer }
        totalAlertCount: { type: integer }
        alerts:
          type: array
          items: { $ref: '#/components/schemas/PlotAlert' }
        latestObservationDate: { type: string, format: date, nullable: true }
        latestObservationAgeDays: { type: integer, nullable: true }
        latestNdvi: { type: number, nullable: true }
        quality: { type: string, nullable: true }
        isSimulated: { type: boolean }
        source: { type: string, nullable: true }
        hasObservation: { type: boolean }
        isStale: { type: boolean }
        noData: { type: boolean }
        needsAttention: { type: boolean }
        reason: { type: string, nullable: true }

    AlertThresholds:
      type: object
      description: Active, documented analysis thresholds - never hidden defaults.
      properties:
        dropAbsolute: { type: number }
        dropRelative: { type: number }
        staleDays: { type: integer }
        stressNdvi: { type: number }
        noRecoveryDays: { type: integer }
        dryRain14dMm: { type: number }
        heatTempMaxC: { type: number }
        maxGapDays: { type: integer }
        minCycleReadings: { type: integer }

    BoundaryPreviewRequest:
      type: object
      required: [boundary]
      properties:
        boundary: { $ref: '#/components/schemas/PlotBoundary' }

    BoundaryPreviewResponse:
      type: object
      description: Server-measured geometry for a boundary that has not been saved.
      properties:
        method: { type: string, enum: [RECTANGLE, POLYGON] }
        geometry: { $ref: '#/components/schemas/PlotGeometry' }
        vertices: { type: array, items: { $ref: '#/components/schemas/LatLon' } }
        geoJsonBoundary: { type: object, nullable: true }
        rectangle: { type: object, nullable: true }
        areaM2: { type: number, nullable: true }
        areaHectares: { type: number, nullable: true }
        perimeterM: { type: number, nullable: true }
        note: { type: string }

    SetBoundaryRequest:
      type: object
      required: [boundary]
      properties:
        boundary: { $ref: '#/components/schemas/PlotBoundary' }
        plotName: { type: string, nullable: true }

    SetBoundaryResponse:
      type: object
      properties:
        plot: { $ref: '#/components/schemas/PlotRef' }
        geometry: { $ref: '#/components/schemas/PlotGeometry' }
        observationsInvalidated: { type: integer }
        note: { type: string, nullable: true }

    LatLon:
      type: object
      required: [lat, lon]
      properties:
        lat: { type: number, minimum: -90, maximum: 90 }
        lon: { type: number, minimum: -180, maximum: 180 }

    PlotBoundary:
      description: Method A is a rotated rectangle; Method B is a polygon ring (min 3 vertices).
      oneOf:
        - type: object
          required: [method, centreLat, centreLon, widthM, lengthM, bearingDeg]
          properties:
            method: { type: string, enum: [RECTANGLE] }
            centreLat: { type: number, minimum: -90, maximum: 90 }
            centreLon: { type: number, minimum: -180, maximum: 180 }
            widthM: { type: number, minimum: 0, maximum: 100000 }
            lengthM: { type: number, minimum: 0, maximum: 100000 }
            bearingDeg: { type: number, minimum: -1080, maximum: 1080 }
        - type: object
          required: [method, vertices]
          properties:
            method: { type: string, enum: [POLYGON] }
            vertices:
              type: array
              minItems: 3
              maxItems: 500
              items: { $ref: '#/components/schemas/LatLon' }

    EventCreateRequest:
      type: object
      required: [plotId, eventDate, kind]
      properties:
        plotId: { type: string, format: uuid }
        eventDate: { type: string, format: date }
        kind:
          type: string
          enum: [HARVEST, CLEARING, HEAT_STRESS, WATER_STRESS, OBSERVATION, OTHER]
        notes: { type: string, nullable: true }
        clientId: { type: string, nullable: true }
        detectedEventId: { type: string, format: uuid, nullable: true }

    EventUpdateRequest:
      type: object
      properties:
        kind:
          type: string
          enum: [HARVEST, CLEARING, HEAT_STRESS, WATER_STRESS, OBSERVATION, OTHER]
        confirmed: { type: boolean }
        notes: { type: string, nullable: true }
        eventDate: { type: string, format: date, nullable: true }

    AlertStatusUpdateRequest:
      type: object
      required: [action]
      properties:
        action:
          type: string
          enum: [ACKNOWLEDGE, DISMISS, REOPEN]
