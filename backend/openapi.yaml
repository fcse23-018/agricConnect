openapi: 3.0.3

info:
  title: AgriConnect API
  version: 1.0.0
  description: |
    AgriConnect REST API v1 — offline-first farm management, satellite NDVI crop
    insights and a produce marketplace for smallholder farmers in Botswana.

    Authoritative narrative contract: [`docs/02-API-CONTRACT.md`](../docs/02-API-CONTRACT.md).

    **Conventions**

    - Base path: `/api/v1` (URL-versioned). Breaking changes require `/api/v2`.
    - Transport: HTTPS only. Payloads are JSON (GeoJSON for plot boundaries).
    - Auth: JWT bearer — short-lived access token (15 min) + rotating refresh token (30 days).
    - Money is **BWP**, `NUMERIC(14,2)`, serialised as a JSON number with 2 decimals.
    - Idempotency-Key is honoured on `POST /auth/register`, `POST /orders` and `POST /sync/push`.
    - Errors never leak internals. Codes: `VALIDATION_ERROR 400`, `UNAUTHENTICATED 401`,
      `INVALID_CREDENTIALS 401`, `TOKEN_EXPIRED 401`, `ACCOUNT_UNVERIFIED 403`,
      `ACCOUNT_SUSPENDED 403`, `FORBIDDEN 403`, `NOT_FOUND 404`, `CONFLICT 409`,
      `DUPLICATE_ACCOUNT 409`, `RATE_LIMITED 429`, `INTERNAL 500`.

    This spec is also served at runtime: interactive docs at `/api-docs` and the raw
    document at `/openapi.json`.
  license:
    name: MIT
    url: https://opensource.org/licenses/MIT

servers:
  - url: /api/v1
    description: Same-origin (relative to the host that serves the API)
  - url: http://localhost:4000/api/v1
    description: Local development

tags:
  - name: Health
  - name: Auth
  - name: Profile
  - name: Account
  - name: Farms
  - name: Farm records
  - name: Finance
  - name: Satellite
  - name: Marketplace
  - name: Orders
  - name: Notifications
  - name: Sync

security:
  - bearerAuth: []

paths:
  /version:
    get:
      tags: [Health]
      summary: API version banner
      security: []
      responses:
        '200':
          description: Version information
          content:
            application/json:
              schema:
                type: object
                properties:
                  version: { type: string, example: 1.0.0 }
                  apiVersion: { type: string, example: v1 }

  /auth/register:
    post:
      tags: [Auth]
      summary: Register a new account
      security: []
      parameters:
        - $ref: '#/components/parameters/IdempotencyKey'
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/RegisterRequest' }
      responses:
        '201':
          description: Account created
          content:
            application/json:
              schema: { $ref: '#/components/schemas/AuthSession' }
        '400': { $ref: '#/components/responses/ValidationError' }
        '409':
          description: Duplicate phone number or email
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ErrorEnvelope' }
        '429': { $ref: '#/components/responses/RateLimited' }

  /auth/login:
    post:
      tags: [Auth]
      summary: Log in with phone number or email
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/LoginRequest' }
      responses:
        '200':
          description: Authenticated
          content:
            application/json:
              schema: { $ref: '#/components/schemas/AuthSession' }
        '401':
          description: Invalid credentials
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ErrorEnvelope' }
        '429': { $ref: '#/components/responses/RateLimited' }

  /auth/refresh:
    post:
      tags: [Auth]
      summary: Rotate a refresh token
      description: Each refresh returns a new refresh token and revokes the old one.
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [refreshToken]
              properties:
                refreshToken: { type: string }
      responses:
        '200':
          description: New token pair
          content:
            application/json:
              schema: { $ref: '#/components/schemas/TokenPair' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '429': { $ref: '#/components/responses/RateLimited' }

  /auth/logout:
    post:
      tags: [Auth]
      summary: Revoke a single refresh token
      requestBody:
        required: false
        content:
          application/json:
            schema:
              type: object
              properties:
                refreshToken: { type: string, nullable: true }
      responses:
        '204': { description: Revoked }
        '401': { $ref: '#/components/responses/Unauthorized' }

  /auth/logout-all:
    post:
      tags: [Auth]
      summary: Revoke every refresh token for the caller
      responses:
        '204': { description: Revoked }
        '401': { $ref: '#/components/responses/Unauthorized' }

  /auth/me:
    get:
      tags: [Auth]
      summary: The authenticated user
      responses:
        '200':
          description: Current user
          content:
            application/json:
              schema:
                type: object
                required: [user]
                properties:
                  user: { $ref: '#/components/schemas/User' }
        '401': { $ref: '#/components/responses/Unauthorized' }

  /auth/password/forgot:
    post:
      tags: [Auth]
      summary: Request a password-reset code
      description: Always generic so it cannot disclose whether an account exists.
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/IdentifierRequest' }
      responses:
        '202':
          description: Accepted (generic)
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Message' }
        '429': { $ref: '#/components/responses/RateLimited' }

  /auth/password/verify:
    post:
      tags: [Auth]
      summary: Verify a password-reset code
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/VerifyCodeRequest' }
      responses:
        '200':
          description: Short-lived reset token
          content:
            application/json:
              schema:
                type: object
                required: [resetToken]
                properties:
                  resetToken: { type: string }
        '400': { $ref: '#/components/responses/ValidationError' }

  /auth/password/reset:
    post:
      tags: [Auth]
      summary: Reset the password with a reset token
      description: On success every refresh token for the user is revoked.
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [resetToken, newPassword]
              properties:
                resetToken: { type: string }
                newPassword: { type: string, minLength: 8 }
      responses:
        '200':
          description: Password reset
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Message' }
        '400': { $ref: '#/components/responses/ValidationError' }

  /auth/verification/request:
    post:
      tags: [Auth]
      summary: Request an account-verification code
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/IdentifierRequest' }
      responses:
        '202':
          description: Accepted
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Message' }

  /auth/verification/confirm:
    post:
      tags: [Auth]
      summary: Confirm an account-verification code
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/VerifyCodeRequest' }
      responses:
        '200':
          description: Verified
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Message' }
        '400': { $ref: '#/components/responses/ValidationError' }

  /users/me:
    get:
      tags: [Profile]
      summary: Full profile of the signed-in user
      responses:
        '200':
          description: Profile
          content:
            application/json:
              schema:
                type: object
                required: [user]
                properties:
                  user: { $ref: '#/components/schemas/User' }
        '401': { $ref: '#/components/responses/Unauthorized' }
    patch:
      tags: [Profile]
      summary: Update the caller's own profile
      description: |
        `fullName` and/or `email`. Changing the email sets `accountStatus` to
        `UNVERIFIED` and issues a verification code. `role` is ignored/rejected.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                fullName: { type: string }
                email: { type: string, format: email, nullable: true }
      responses:
        '200':
          description: Updated profile
          content:
            application/json:
              schema:
                type: object
                required: [user]
                properties:
                  user: { $ref: '#/components/schemas/User' }
                  devVerificationCode:
                    type: string
                    nullable: true
                    description: Development-only; present only when EXPOSE_DEV_CODES is set.
        '400': { $ref: '#/components/responses/ValidationError' }
        '409':
          description: Email already in use
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ErrorEnvelope' }

  /users/me/password:
    post:
      tags: [Profile]
      summary: Change the password
      description: Revokes other sessions; optionally keeps the caller's own refresh token.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [currentPassword, newPassword]
              properties:
                currentPassword: { type: string }
                newPassword: { type: string, minLength: 8 }
                keepRefreshToken: { type: string, nullable: true }
      responses:
        '200':
          description: Password changed
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Message' }
        '400': { $ref: '#/components/responses/ValidationError' }
        '401': { $ref: '#/components/responses/Unauthorized' }

  /users/me/notification-preferences:
    put:
      tags: [Profile]
      summary: Update notification preferences
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/NotificationPreferences' }
      responses:
        '200':
          description: Updated profile
          content:
            application/json:
              schema:
                type: object
                required: [user]
                properties:
                  user: { $ref: '#/components/schemas/User' }

  /users/me/avatar:
    post:
      tags: [Profile]
      summary: Upload an avatar image
      description: Multipart image ≤ 2 MB (jpeg/png/webp) in the `avatar` field.
      requestBody:
        required: true
        content:
          multipart/form-data:
            schema:
              type: object
              required: [avatar]
              properties:
                avatar: { type: string, format: binary }
      responses:
        '200':
          description: Updated profile
          content:
            application/json:
              schema:
                type: object
                required: [user]
                properties:
                  user: { $ref: '#/components/schemas/User' }
        '400': { $ref: '#/components/responses/ValidationError' }

  /users/me/export:
    get:
      tags: [Profile]
      summary: Machine-readable personal-data export
      responses:
        '200':
          description: Export document
          content:
            application/json:
              schema:
                type: object
                description: Open-ended document owned by the backend; contains the user, plots, records, orders and notifications.
                additionalProperties: true

  /users/me/employer-link:
    post:
      tags: [Profile]
      summary: Link a farmer to the farm owner who employs them
      description: |
        Not enumerated in the narrative contract; added by migration 005. The
        employee supplies the employer's phone number.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [employerPhone]
              properties:
                employerPhone: { type: string, example: '+2677xxxxxxx' }
      responses:
        '200':
          description: Linked
          content:
            application/json:
              schema:
                type: object
                required: [user]
                properties:
                  user: { $ref: '#/components/schemas/User' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }

  /users/me/deletion-request:
    post:
      tags: [Account]
      summary: Request account deletion (re-authentication required)
      description: |
        Sets `accountStatus` to `PENDING_DELETION`, revokes all sessions and starts
        the grace period. Returns `202` when a new request is created, `200` when
        returning an existing pending request.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [password]
              properties:
                password: { type: string }
                reason: { type: string, maxLength: 500, nullable: true }
      responses:
        '200':
          description: Existing request returned
          content:
            application/json:
              schema: { $ref: '#/components/schemas/DeletionRequest' }
        '202':
          description: Grace period started
          content:
            application/json:
              schema: { $ref: '#/components/schemas/DeletionRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
    get:
      tags: [Account]
      summary: Current deletion request
      responses:
        '200':
          description: The current request (or `null`)
          content:
            application/json:
              schema:
                type: object
                properties:
                  request: { $ref: '#/components/schemas/DeletionRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }

  /users/me/deletion-request/cancel:
    post:
      tags: [Account]
      summary: Cancel a pending deletion during the grace period
      responses:
        '200':
          description: Cancelled
          content:
            application/json:
              schema:
                type: object
                properties:
                  request: { $ref: '#/components/schemas/DeletionRequest' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409':
          description: Grace period ended or already completed
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ErrorEnvelope' }

  /public/account-deletion:
    post:
      tags: [Account]
      summary: Store-required public account-deletion page
      description: Unauthenticated. Always returns the same generic `202`.
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [identifier]
              properties:
                identifier: { type: string }
                reason: { type: string, maxLength: 500, nullable: true }
      responses:
        '202':
          description: Accepted (generic)
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Message' }

  /farms/plots:
    get:
      tags: [Farms]
      summary: The plots on your farm
      responses:
        '200':
          description: Plots, newest first
          content:
            application/json:
              schema:
                type: object
                required: [items]
                properties:
                  items:
                    type: array
                    items: { $ref: '#/components/schemas/FarmPlot' }
        '403': { $ref: '#/components/responses/Forbidden' }
    post:
      tags: [Farms]
      summary: Create (or replay) a plot
      description: |
        Idempotent on `clientId`: a replayed `clientId` updates the existing row and
        lifts any soft delete, returning `200`; a new row returns `201`.
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/FarmPlotCreate' }
      responses:
        '200':
          description: Replayed update
          content:
            application/json:
              schema: { $ref: '#/components/schemas/FarmPlot' }
        '201':
          description: Created
          content:
            application/json:
              schema: { $ref: '#/components/schemas/FarmPlot' }
        '403': { $ref: '#/components/responses/Forbidden' }

  /farms/plots/{id}:
    parameters:
      - $ref: '#/components/parameters/ResourceId'
    get:
      tags: [Farms]
      summary: Get one owned plot
      responses:
        '200':
          description: Plot
          content:
            application/json:
              schema: { $ref: '#/components/schemas/FarmPlot' }
        '404': { $ref: '#/components/responses/NotFound' }
    patch:
      tags: [Farms]
      summary: Update an owned plot
      description: >-
        Returns the updated plot plus `observationsInvalidated`. If the request
        changes the boundary, the plot's stored satellite observations (averaged
        over the old outline) are cleared and the count is reported; an unchanged
        boundary leaves the series intact. The same rule is applied by
        `PUT /satellite/plots/{id}/boundary` and the offline sync replay.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                plotName: { type: string }
                areaHectares: { type: number, nullable: true }
                geoJsonBoundary: { type: object, nullable: true }
                notes: { type: string, nullable: true }
      responses:
        '200':
          description: Updated plot
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/FarmPlot'
                  - type: object
                    properties:
                      observationsInvalidated:
                        type: integer
                        description: Observations cleared because they covered the previous boundary.
        '404': { $ref: '#/components/responses/NotFound' }
    delete:
      tags: [Farms]
      summary: Soft-delete an owned plot
      responses:
        '204': { description: Deleted }
        '404': { $ref: '#/components/responses/NotFound' }

  /farm/harvests:
    get:
      tags: [Farm records]
      summary: List harvest records
      parameters:
        - $ref: '#/components/parameters/Page'
        - $ref: '#/components/parameters/PageSize'
        - name: from
          in: query
          schema: { type: string, format: date }
        - name: to
          in: query
          schema: { type: string, format: date }
        - name: cropType
          in: query
          schema: { type: string }
      responses:
        '200':
          description: Paginated harvest records
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/PageMeta'
                  - type: object
                    properties:
                      items:
                        type: array
                        items: { $ref: '#/components/schemas/HarvestRecord' }
        '403': { $ref: '#/components/responses/Forbidden' }
    post:
      tags: [Farm records]
      summary: Create (or replay) a harvest record
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/HarvestCreate' }
      responses:
        '200':
          description: Replayed update
          content:
            application/json:
              schema: { $ref: '#/components/schemas/HarvestRecord' }
        '201':
          description: Created
          content:
            application/json:
              schema: { $ref: '#/components/schemas/HarvestRecord' }

  /farm/harvests/{id}:
    parameters:
      - $ref: '#/components/parameters/ResourceId'
    get:
      tags: [Farm records]
      summary: Get one harvest record
      responses:
        '200':
          description: Harvest record
          content:
            application/json:
              schema: { $ref: '#/components/schemas/HarvestRecord' }
        '404': { $ref: '#/components/responses/NotFound' }
    patch:
      tags: [Farm records]
      summary: Update a harvest record
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/HarvestCreate' }
      responses:
        '200':
          description: Updated
          content:
            application/json:
              schema: { $ref: '#/components/schemas/HarvestRecord' }
        '404': { $ref: '#/components/responses/NotFound' }
    delete:
      tags: [Farm records]
      summary: Delete a harvest record
      responses:
        '204': { description: Deleted }
        '404': { $ref: '#/components/responses/NotFound' }

  /farm/livestock:
    get:
      tags: [Farm records]
      summary: List livestock counts
      parameters:
        - $ref: '#/components/parameters/Page'
        - $ref: '#/components/parameters/PageSize'
        - name: from
          in: query
          schema: { type: string, format: date }
        - name: to
          in: query
          schema: { type: string, format: date }
      responses:
        '200':
          description: Paginated livestock counts
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/PageMeta'
                  - type: object
                    properties:
                      items:
                        type: array
                        items: { $ref: '#/components/schemas/LivestockCount' }
    post:
      tags: [Farm records]
      summary: Create (or replay) a livestock count
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/LivestockCreate' }
      responses:
        '200':
          description: Replayed update
          content:
            application/json:
              schema: { $ref: '#/components/schemas/LivestockCount' }
        '201':
          description: Created
          content:
            application/json:
              schema: { $ref: '#/components/schemas/LivestockCount' }

  /farm/livestock/{id}:
    parameters:
      - $ref: '#/components/parameters/ResourceId'
    get:
      tags: [Farm records]
      summary: Get one livestock count
      responses:
        '200':
          description: Livestock count
          content:
            application/json:
              schema: { $ref: '#/components/schemas/LivestockCount' }
        '404': { $ref: '#/components/responses/NotFound' }
    patch:
      tags: [Farm records]
      summary: Update a livestock count
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/LivestockCreate' }
      responses:
        '200':
          description: Updated
          content:
            application/json:
              schema: { $ref: '#/components/schemas/LivestockCount' }
        '404': { $ref: '#/components/responses/NotFound' }
    delete:
      tags: [Farm records]
      summary: Delete a livestock count
      responses:
        '204': { description: Deleted }
        '404': { $ref: '#/components/responses/NotFound' }

  /finance/sales:
    get:
      tags: [Finance]
      summary: List sales (farm owner only)
      parameters:
        - $ref: '#/components/parameters/Page'
        - $ref: '#/components/parameters/PageSize'
        - name: from
          in: query
          schema: { type: string, format: date }
        - name: to
          in: query
          schema: { type: string, format: date }
      responses:
        '200':
          description: Paginated sales
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/PageMeta'
                  - type: object
                    properties:
                      items:
                        type: array
                        items: { $ref: '#/components/schemas/SaleTransaction' }
        '403': { $ref: '#/components/responses/Forbidden' }
    post:
      tags: [Finance]
      summary: Create (or replay) a sale
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/SaleCreate' }
      responses:
        '200':
          description: Replayed update
          content:
            application/json:
              schema: { $ref: '#/components/schemas/SaleTransaction' }
        '201':
          description: Created
          content:
            application/json:
              schema: { $ref: '#/components/schemas/SaleTransaction' }
        '403': { $ref: '#/components/responses/Forbidden' }

  /finance/sales/{id}:
    parameters:
      - $ref: '#/components/parameters/ResourceId'
    get:
      tags: [Finance]
      summary: Get one sale
      responses:
        '200':
          description: Sale
          content:
            application/json:
              schema: { $ref: '#/components/schemas/SaleTransaction' }
        '404': { $ref: '#/components/responses/NotFound' }
    patch:
      tags: [Finance]
      summary: Update a sale
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/SaleCreate' }
      responses:
        '200':
          description: Updated
          content:
            application/json:
              schema: { $ref: '#/components/schemas/SaleTransaction' }
        '404': { $ref: '#/components/responses/NotFound' }
    delete:
      tags: [Finance]
      summary: Delete a sale
      responses:
        '204': { description: Deleted }
        '404': { $ref: '#/components/responses/NotFound' }

  /finance/expenses:
    get:
      tags: [Finance]
      summary: List expenses (farm owner only)
      parameters:
        - $ref: '#/components/parameters/Page'
        - $ref: '#/components/parameters/PageSize'
        - name: from
          in: query
          schema: { type: string, format: date }
        - name: to
          in: query
          schema: { type: string, format: date }
      responses:
        '200':
          description: Paginated expenses
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/PageMeta'
                  - type: object
                    properties:
                      items:
                        type: array
                        items: { $ref: '#/components/schemas/Expense' }
        '403': { $ref: '#/components/responses/Forbidden' }
    post:
      tags: [Finance]
      summary: Create (or replay) an expense
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/ExpenseCreate' }
      responses:
        '200':
          description: Replayed update
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Expense' }
        '201':
          description: Created
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Expense' }
        '403': { $ref: '#/components/responses/Forbidden' }

  /finance/expenses/{id}:
    parameters:
      - $ref: '#/components/parameters/ResourceId'
    get:
      tags: [Finance]
      summary: Get one expense
      responses:
        '200':
          description: Expense
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Expense' }
        '404': { $ref: '#/components/responses/NotFound' }
    patch:
      tags: [Finance]
      summary: Update an expense
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/ExpenseCreate' }
      responses:
        '200':
          description: Updated
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Expense' }
        '404': { $ref: '#/components/responses/NotFound' }
    delete:
      tags: [Finance]
      summary: Delete an expense
      responses:
        '204': { description: Deleted }
        '404': { $ref: '#/components/responses/NotFound' }

  /finance/summary:
    get:
      tags: [Finance]
      summary: Sales/expense totals and monthly series (farm owner only)
      parameters:
        - name: from
          in: query
          schema: { type: string, format: date }
        - name: to
          in: query
          schema: { type: string, format: date }
      responses:
        '200':
          description: Financial summary
          content:
            application/json:
              schema: { $ref: '#/components/schemas/FinanceSummary' }
        '403': { $ref: '#/components/responses/Forbidden' }

  /satellite/ndvi:
    post:
      tags: [Satellite]
      summary: Request an NDVI computation for a plot (farm owner only)
      description: |
        A cloud-covered observation returns `201` with `status: FAILED` and
        `meanNdviValue: null` — never a fabricated value.

        A `GENERATED` result also carries an `advice` block, built once on the
        server from the reading's own value, its trend against the plot's previous
        generated reading, the area averaged, the observation's age and cloud cover.
        The advice never invents a measurement and never asserts a cause; it states
        what the band means, what to check, and how far the measurement can be
        trusted. It is attached to this response, to `/satellite/ndvi/latest` and to
        `/satellite/ndvi/{id}` — deliberately not to the paginated history, where it
        would cost two extra queries per item.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [plotId]
              properties:
                plotId: { type: string, format: uuid }
                geoJsonBoundary: { type: object, nullable: true }
      responses:
        '201':
          description: NDVI record (possibly FAILED)
          content:
            application/json:
              schema: { $ref: '#/components/schemas/NdviRecord' }
        '403': { $ref: '#/components/responses/Forbidden' }
    get:
      tags: [Satellite]
      summary: NDVI history for a plot (farm owner only)
      parameters:
        - name: plotId
          in: query
          required: false
          schema: { type: string, format: uuid }
        - $ref: '#/components/parameters/Page'
        - $ref: '#/components/parameters/PageSize'
      responses:
        '200':
          description: Paginated NDVI history, newest first
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/PageMeta'
                  - type: object
                    properties:
                      items:
                        type: array
                        items: { $ref: '#/components/schemas/NdviRecord' }

  /satellite/ndvi/latest:
    get:
      tags: [Satellite]
      summary: Latest NDVI for a plot (farm owner only)
      description: Not enumerated in the narrative contract; convenience endpoint.
      parameters:
        - name: plotId
          in: query
          required: false
          schema: { type: string, format: uuid }
      responses:
        '200':
          description: Latest record (or `null`)
          content:
            application/json:
              schema:
                type: object
                properties:
                  ndvi: { $ref: '#/components/schemas/NdviRecord' }

  /satellite/ndvi/{id}:
    parameters:
      - $ref: '#/components/parameters/ResourceId'
    get:
      tags: [Satellite]
      summary: Get one NDVI record (farm owner only)
      responses:
        '200':
          description: NDVI record
          content:
            application/json:
              schema: { $ref: '#/components/schemas/NdviRecord' }
        '404': { $ref: '#/components/responses/NotFound' }

  # =========================================================================
  # Satellite Monitoring — Unified Dashboard
  # =========================================================================

  /satellite/overview:
    get:
      tags: [Satellite]
      summary: Complete monitoring dashboard for a plot (farm owner only)
      description: |
        Returns the full dashboard: geometry, observation series with smoothing,
        growth-cycle estimates, detected drops with possible explanations,
        weather, alerts, quality metrics, and model status. All values are
        honest — simulated data is labelled, gaps are reported, and no
        measurement is ever invented.
      parameters:
        - name: plotId
          in: query
          required: true
          schema: { type: string, format: uuid }
        - name: days
          in: query
          description: Observation window. `daysBack` is accepted as an alias.
          schema: { type: integer, minimum: 15, maximum: 730, default: 365 }
        - name: daysBack
          in: query
          description: Alias of `days`.
          schema: { type: integer, minimum: 15, maximum: 730 }
        - name: refresh
          in: query
          description: Force a fresh provider call instead of the stored series.
          schema: { type: boolean }
      responses:
        '200':
          description: Complete monitoring overview
          content:
            application/json:
              schema: { $ref: '#/components/schemas/SatelliteOverview' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }

  /satellite/boundary/preview:
    post:
      tags: [Satellite]
      summary: Preview a boundary geometry before saving (farm owner only)
      description: |
        Validates a RECTANGLE (centre, width, length, bearing) or POLYGON
        (vertices, minimum 3) and returns the server-computed geometry with
        area/perimeter/centroid, or `valid:false` with a `reason`. Does not
        persist anything. Measurements come from the same code path as the save,
        so the previewed area is the area that would be stored.
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/BoundaryPreviewRequest' }
      responses:
        '200':
          description: Preview with the measured geometry
          content:
            application/json:
              schema: { $ref: '#/components/schemas/BoundaryPreviewResponse' }
        '403': { $ref: '#/components/responses/Forbidden' }

  /satellite/plots/{plotId}/boundary:
    parameters:
      - $ref: '#/components/parameters/ResourceId'
        name: plotId
    put:
      tags: [Satellite]
      summary: Set or replace a plot boundary (farm owner only)
      description: |
        Accepts either a RECTANGLE (centre, width, length, bearing) or a
        POLYGON (vertices, minimum 3). Validates geometry (no self-intersections,
        no slivers, plausible size) and persists the boundary. Returns the
        updated plot with the computed geometry.
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/SetBoundaryRequest' }
      responses:
        '200':
          description: Updated plot with geometry
          content:
            application/json:
              schema: { $ref: '#/components/schemas/SetBoundaryResponse' }
        '400': { $ref: '#/components/responses/ValidationError' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }

  /satellite/colour-map:
    get:
      tags: [Satellite]
      summary: Per-pixel NDVI/EVI colour map for a plot's newest reading (farm owner only)
      description: |
        The "satellite sight" view: a grid of index values for the most recent
        usable stored observation, plus everything needed to read it honestly.

        **The grid is built so its in-boundary average equals the measured plot
        mean** — that average is a real number. The *pattern* across the grid is a
        simulated texture generated from the plot id and date, not a per-pixel
        observation, and the response always says so via
        `variationSimulated: true`. `isSimulated: true` additionally means the
        mean itself is demonstration (MOCK) data.

        Cells that fall outside the boundary are `null`, not `0`, so a client can
        draw the field's shape instead of inventing bare soil along its edge.

        Drawn from the **stored** series, never a fresh provider call, so the
        picture always agrees with the numbers on the same screen.
      parameters:
        - name: plotId
          in: query
          required: true
          schema: { type: string, format: uuid }
        - name: index
          in: query
          description: Which index to render. Defaults to `ndvi`.
          schema: { type: string, enum: [ndvi, evi], default: ndvi }
        - name: size
          in: query
          description: Grid resolution per side (cells). Clamped to 8–48.
          schema: { type: integer, minimum: 8, maximum: 48, default: 24 }
        - name: days
          in: query
          description: Observation window used to find the newest reading.
          schema: { type: integer, minimum: 15, maximum: 730, default: 15 }
      responses:
        '200':
          description: |
            The colour map, or `available: false` with a `reason` when there is no
            boundary or no usable observation.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ColourMap' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }

  /satellite/weather:
    get:
      tags: [Satellite]
      summary: Weather history for a plot (farm owner only)
      description: |
        Returns modelled weather from Open-Meteo (rainfall, min/max/avg
        temperature, top-soil moisture) for the plot centroid, wrapped as
        `{plotId, weather, source, dataType}`. If the weather provider is
        disabled or fails, `weather.available` is false with a `reason` rather
        than invented values. Source and dataType are always labelled.
      parameters:
        - name: plotId
          in: query
          required: true
          schema: { type: string, format: uuid }
        - name: days
          in: query
          description: Observation window. `daysBack` is accepted as an alias.
          schema: { type: integer, minimum: 15, maximum: 730, default: 15 }
        - name: daysBack
          in: query
          description: Alias of `days`.
          schema: { type: integer, minimum: 15, maximum: 730 }
      responses:
        '200':
          description: Weather series
          content:
            application/json:
              schema: { $ref: '#/components/schemas/WeatherResponse' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }

  /satellite/events:
    get:
      tags: [Satellite]
      summary: Paged event log for a plot, farmer entries and detected drops (farm owner only)
      parameters:
        - name: plotId
          in: query
          required: true
          schema: { type: string, format: uuid }
        - $ref: '#/components/parameters/Page'
        - $ref: '#/components/parameters/PageSize'
      responses:
        '200':
          description: One page of events (farmer + system, newest first)
          content:
            application/json:
              schema:
                type: object
                required: [items, page, pageSize, total, hasMore]
                properties:
                  items:
                    type: array
                    items: { $ref: '#/components/schemas/PlotEvent' }
                  page: { type: integer }
                  pageSize: { type: integer }
                  total: { type: integer }
                  hasMore: { type: boolean }
        '403': { $ref: '#/components/responses/Forbidden' }
    post:
      tags: [Satellite]
      summary: Add a farmer event (idempotent via clientId)
      description: |
        Creates a farmer event. If clientId is supplied and a row with the same
        plotId+clientId already exists, the existing row is returned (no 500).
        Supplying a detectedEventId marks the detected drop as reviewed and
        confirmed by the farmer.
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/EventCreateRequest' }
      responses:
        '201':
          description: Created event (or existing if replayed)
          content:
            application/json:
              schema: { $ref: '#/components/schemas/PlotEvent' }
        '400': { $ref: '#/components/responses/ValidationError' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }

  /satellite/events/{eventId}:
    parameters:
      - $ref: '#/components/parameters/ResourceId'
        name: eventId
    patch:
      tags: [Satellite]
      summary: Confirm or correct an event (farm owner only)
      description: |
        A farmer may correct the kind, confirm, add notes, or adjust the date.
        Supplying a kind is itself a confirmation and makes the row a verified
        training label. Works on SYSTEM-detected rows: that is the
        confirm/correct flow, and the system's suggestion is kept in the record.
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/EventUpdateRequest' }
      responses:
        '200':
          description: Updated event
          content:
            application/json:
              schema: { $ref: '#/components/schemas/PlotEvent' }
        '400': { $ref: '#/components/responses/ValidationError' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
    delete:
      tags: [Satellite]
      summary: Delete a farmer event (farm owner only)
      description: |
        Only farmer-recorded rows can be deleted. A SYSTEM-detected row answers
        409 CONFLICT - it must be confirmed or corrected instead, so the
        detection history is never silently erased.
      responses:
        '204':
          description: Deleted
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409': { $ref: '#/components/responses/Conflict' }

  /satellite/alerts/by-farm:
    get:
      tags: [Satellite]
      summary: Farm-wide attention summary across every plot the caller owns (farm owner only)
      description: |
        Answers "which of my farms need attention?" rather than describing one
        selected plot. Every live plot is returned, including plots with **no
        observation at all**, which are flagged `noData: true` — silence on a plot
        is not the same as that plot being healthy, and this endpoint refuses to
        let a forgotten field look fine by being absent from the list.

        Three distinct attention states are reported per plot: open alerts
        (`openAlertCount > 0`), stale data (`isStale`), and no data (`noData`).
        Plots in none of these states are returned as `needsAttention: false` with
        a null `reason`.
      parameters:
        - name: includeHealthy
          in: query
          description: Set to `false` to omit plots that need no attention.
          schema: { type: boolean, default: true }
      responses:
        '200':
          description: Plots and farms with counts and thresholds
          content:
            application/json:
              schema: { $ref: '#/components/schemas/AlertsByFarm' }
        '403': { $ref: '#/components/responses/Forbidden' }

  /satellite/alerts:
    get:
      tags: [Satellite]
      summary: Paged alerts for a plot (farm owner only)
      description: |
        Deduplicated by alert_key (one ongoing event = one alert). Statuses:
        OPEN, ACKNOWLEDGED, DISMISSED. A dismissed alert is never resurrected
        by a later analysis run. Only WARNING/CRITICAL create notifications.
        The response repeats the active thresholds so the app can show why an
        alert fired.
      parameters:
        - name: plotId
          in: query
          required: true
          schema: { type: string, format: uuid }
        - name: status
          in: query
          schema: { type: string, enum: [OPEN, ACKNOWLEDGED, DISMISSED] }
        - $ref: '#/components/parameters/Page'
        - $ref: '#/components/parameters/PageSize'
      responses:
        '200':
          description: One page of alerts, with the active thresholds
          content:
            application/json:
              schema:
                type: object
                required: [items, page, pageSize, total, hasMore, thresholds]
                properties:
                  items:
                    type: array
                    items: { $ref: '#/components/schemas/PlotAlert' }
                  page: { type: integer }
                  pageSize: { type: integer }
                  total: { type: integer }
                  hasMore: { type: boolean }
                  thresholds: { $ref: '#/components/schemas/AlertThresholds' }
        '403': { $ref: '#/components/responses/Forbidden' }

  /satellite/alerts/{alertId}/status:
    parameters:
      - $ref: '#/components/parameters/ResourceId'
        name: alertId
    post:
      tags: [Satellite]
      summary: Acknowledge, dismiss or reopen an alert (farm owner only)
      description: |
        Takes an ACTION, not a target status. DISMISS is terminal: a later
        analysis run never flips the alert back to OPEN.
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/AlertStatusUpdateRequest' }
      responses:
        '200':
          description: Updated alert
          content:
            application/json:
              schema: { $ref: '#/components/schemas/PlotAlert' }
        '400': { $ref: '#/components/responses/ValidationError' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }

  /satellite/plots/latest:
    get:
      tags: [Satellite]
      summary: Latest plots with observation status for the dashboard (farm owner only)
      description: |
        Returns a compact per-plot summary - newest observation date and age,
        NDVI/EVI, quality and whether it is simulated - with no provider call.
        Used by the mobile dashboard.
      parameters:
        - $ref: '#/components/parameters/Page'
        - $ref: '#/components/parameters/PageSize'
      responses:
        '200':
          description: One page of compact plot summaries
          content:
            application/json:
              schema:
                type: object
                required: [items, page, pageSize, total, hasMore]
                properties:
                  items:
                    type: array
                    items: { $ref: '#/components/schemas/PlotSummary' }
                  page: { type: integer }
                  pageSize: { type: integer }
                  total: { type: integer }
                  hasMore: { type: boolean }
        '403': { $ref: '#/components/responses/Forbidden' }

  /marketplace/listings:
    get:
      tags: [Marketplace]
      summary: Browse published listings
      parameters:
        - name: search
          in: query
          schema: { type: string }
        - name: crop
          in: query
          schema: { type: string }
        - name: minPrice
          in: query
          schema: { type: number }
        - name: maxPrice
          in: query
          schema: { type: number }
        - name: sort
          in: query
          schema: { type: string, enum: [price_asc, price_desc, recent] }
        - $ref: '#/components/parameters/Page'
        - $ref: '#/components/parameters/PageSize'
      responses:
        '200':
          description: Paginated published listings
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/PageMeta'
                  - type: object
                    properties:
                      items:
                        type: array
                        items: { $ref: '#/components/schemas/ProduceListing' }
        '403': { $ref: '#/components/responses/Forbidden' }
    post:
      tags: [Marketplace]
      summary: Create a draft listing (farm owner only)
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/ListingCreate' }
      responses:
        '201':
          description: Draft created
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ProduceListing' }
        '403': { $ref: '#/components/responses/Forbidden' }

  /marketplace/my-listings:
    get:
      tags: [Marketplace]
      summary: Your own listings in every state
      parameters:
        - $ref: '#/components/parameters/Page'
        - $ref: '#/components/parameters/PageSize'
      responses:
        '200':
          description: Paginated own listings
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/PageMeta'
                  - type: object
                    properties:
                      items:
                        type: array
                        items: { $ref: '#/components/schemas/ProduceListing' }
        '403': { $ref: '#/components/responses/Forbidden' }

  /marketplace/listings/{id}:
    parameters:
      - $ref: '#/components/parameters/ResourceId'
    get:
      tags: [Marketplace]
      summary: Get a listing (published, or the owner's own in any state)
      responses:
        '200':
          description: Listing
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ProduceListing' }
        '404': { $ref: '#/components/responses/NotFound' }
    patch:
      tags: [Marketplace]
      summary: Update an owned listing (farm owner only)
      description: Status changes flow exclusively through publish/archive.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                produce: { type: string }
                description: { type: string, nullable: true }
                quantity: { type: number }
                unit: { $ref: '#/components/schemas/ListingUnit' }
                price: { type: number }
                imageUrl: { type: string, nullable: true }
                locationText: { type: string, nullable: true }
      responses:
        '200':
          description: Updated listing
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ProduceListing' }
        '400': { $ref: '#/components/responses/ValidationError' }
        '404': { $ref: '#/components/responses/NotFound' }

  /marketplace/listings/{id}/publish:
    parameters:
      - $ref: '#/components/parameters/ResourceId'
    post:
      tags: [Marketplace]
      summary: Publish a draft listing (farm owner only)
      description: A listing with no stock cannot be published. Publishing is idempotent.
      responses:
        '200':
          description: Published (or already published)
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ProduceListing' }
        '400': { $ref: '#/components/responses/ValidationError' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409':
          description: Not publishable from its current state
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ErrorEnvelope' }

  /marketplace/listings/{id}/archive:
    parameters:
      - $ref: '#/components/parameters/ResourceId'
    post:
      tags: [Marketplace]
      summary: Archive (unpublish) a listing (farm owner only)
      description: Returns the listing to `DRAFT`; the row and stock history are preserved.
      responses:
        '200':
          description: Archived
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ProduceListing' }
        '404': { $ref: '#/components/responses/NotFound' }

  /orders:
    post:
      tags: [Orders]
      summary: Place an order (buyer only)
      description: Transactional stock check; over-ordering returns `409`. Idempotent.
      parameters:
        - $ref: '#/components/parameters/IdempotencyKey'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
